name: One-off Discord AutoTranslate Luna APK
on:
  push:
    branches:
      - build-discord-luna-20261116
    paths:
      - .github/workflows/discord-luna-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-luna-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4

      - name: Fetch upstream Android source
        run: git clone --depth 1 https://github.com/wxmyyds/DiscordAutoTranslate.git upstream

      - name: Apply Luna compatibility and error-diagnostics patch
        run: |
          git -C upstream apply --check "$GITHUB_WORKSPACE/.ci/DiscordAutoTranslate-luna.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/.ci/DiscordAutoTranslate-luna.patch"
          echo "Patched:"
          git -C upstream diff --stat

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 37 and build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMGR"
          set +e
          yes | "$SDKMGR" --licenses > /dev/null 2>&1
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e
          test "$LICENSE_STATUS" -eq 0
          "$SDKMGR" "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Generate independent temporary APK signing key
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/luna-signing"
          mkdir -p "$KEY_DIR"
          PASS="$(openssl rand -hex 18)"
          keytool -genkeypair -noprompt \
            -alias luna -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=Discord Luna Personal Test, O=Independent Build" \
            -keystore "$KEY_DIR/luna.jks" -storepass "$PASS" -keypass "$PASS"
          printf 'storeFile=luna.jks\nstorePassword=%s\nkeyAlias=luna\nkeyPassword=%s\n' \
            "$PASS" "$PASS" > "$KEY_DIR/keystore.properties"
          chmod 600 "$KEY_DIR/keystore.properties"
          echo "KEYSTORE_PROPERTIES=$KEY_DIR/keystore.properties" >> "$GITHUB_ENV"

      - name: Assemble independently signed release APK
        run: gradle --no-daemon --project-dir upstream assembleRelease

      - name: Run JVM unit tests
        run: gradle --no-daemon --project-dir upstream testDebugUnitTest

      - name: Verify APK signature and Xposed entry metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find upstream/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          unzip -l "$APK" | grep -F 'META-INF/xposed/'
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DiscordAutoTranslate-Luna-independent-signed
          path: upstream/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
